opencollection: 1.0.0
info:
  name: Demo API
  summary: Example OpenCollection for testing Missio
  version: 1.0.0
  authors:
    - name: Missio
config:
  protobuf:
    protoFiles:
      - type: file
        path: proto/services/missio_demo.proto
    importPaths:
      - path: proto
  proxy:
    enabled: false
    config:
      protocol: http
      hostname: 127.0.0.1
      port: 3457
      auth:
        username: demo-proxy
        password: demo-proxy
      bypassProxy: localhost,127.0.0.1
  clientCertificates:
    - domain: 127.0.0.1
      type: pem
      certificateFilePath: fixtures/mtls-client.crt
      privateKeyFilePath: fixtures/mtls-client.key
  environments:
    - name: LOCAL
      variables:
        - name: baseUrl
          value: http://localhost:3456
        - name: mtlsBaseUrl
          value: https://127.0.0.1:3443
        - name: grpcBaseUrl
          value: localhost:50051
        - name: userId
          value: "1"
        - name: grpcName
          value: Ada
        - name: grpcUserId
          value: "42"
        - name: grpcRequestId
          value: demo-trace-001
        - name: grpcToken
          value: demo-token
        - name: wsBaseUrl
          value: ws://localhost:3456
        - name: socketUser
          value: Ada
        - name: socketMessageId
          value: ws-demo-001
        - name: runtimeSocketCountSeed
          value: "7"
        - name: demoToken
          value: demo-token
      color: charts.blue
    - name: DEV
      variables:
        - name: baseUrl
          value: https://jsonplaceholder.typicode.com
        - name: userId
          value: "1"
      color: charts.red
    - name: PROD
      variables:
        - name: baseUrl
          value: https://api.example.com
        - name: userId
          value: "42"
        - secret: true
          name: azureKeyVault:api-key
      color: terminal.ansiGreen
request:
  headers:
    - name: Accept
      value: application/json
  metadata:
    - name: x-demo-default
      value: collection-{{grpcRequestId}}
